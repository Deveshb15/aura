name: Aura
options:
  bundleIdPrefix: app
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "25"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
    COMBINE_HIDPI_IMAGES: "YES"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: "2.7.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"
targets:
  Aura:
    type: application
    platform: macOS
    sources:
      - path: Aura
    settings:
      base:
        PRODUCT_NAME: Carpet
        PRODUCT_BUNDLE_IDENTIFIER: app.captureaura
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Aura/Info.plist
        CODE_SIGN_ENTITLEMENTS: Aura/Aura.entitlements
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: GRDB
        product: GRDB
      - package: SwiftSoup
        product: SwiftSoup
      - package: Sparkle
        product: Sparkle
      # Bundle the native-messaging host helper into Aura.app/Contents/MacOS
      # (the standard, code-sign-safe location for a nested executable).
      - target: aura-x-host
        embed: true
        link: false
        copy:
          destination: executables
          codeSign: true
  aura-x-host:
    type: tool
    platform: macOS
    sources:
      - path: XHost
    settings:
      base:
        PRODUCT_NAME: aura-x-host
        PRODUCT_BUNDLE_IDENTIFIER: app.captureaura.xhost
